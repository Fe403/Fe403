name: Atualizar cards do perfil

on:
  schedule:
    - cron: "0 6 * * *"   # todo dia, 03:00 no horario de Brasilia
  workflow_dispatch:       # permite rodar na mao pela aba Actions
  push:
    branches: [main]
    paths:
      - scripts/generate_cards.py
      - .github/workflows/update-cards.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar cards
        env:
          # Usa o token pessoal (GH_PAT) se existir, senao o token padrao do Actions
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_USER: Fe403
          # EXCLUDE_LANGS: "Shell,Jupyter Notebook"
        run: python scripts/generate_cards.py

      - name: Salvar mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards
          git diff --cached --quiet || git commit -m "chore: atualiza cards do perfil"
          git push
